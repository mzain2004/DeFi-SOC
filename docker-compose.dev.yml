services:
  # Redis: Ingestion telemetry queue & L1->L2 handoff broker
  redis:
    image: redis:7-alpine
    container_name: defisoc-dev-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # Postgres: Local stand-in for Supabase during local integration & unit tests
  postgres:
    image: postgres:15-alpine
    container_name: defisoc-dev-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: defisoc_dev
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 5

  # Anvil: Local Ethereum test node for mainnet fork state integration testing
  anvil:
    image: ghcr.io/foundry-rs/foundry:latest
    container_name: defisoc-dev-anvil
    env_file:
      - .env
    entrypoint: ["anvil"]
    command: ["--host", "0.0.0.0", "--port", "8545", "--block-time", "1", "--fork-url", "${ETH_MAINNET_RPC_URL}"]
    ports:
      - "8545:8545"
    healthcheck:
      test: ["CMD", "cast", "block-number", "--rpc-url", "http://localhost:8545"]
      interval: 5s
      timeout: 3s
      retries: 5
