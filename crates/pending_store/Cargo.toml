[package]
name = "pending_store"
version = "0.1.0"
edition = "2021"

[dependencies]
shared_types = { path = "../shared_types" }
crypto = { path = "../crypto" }
sqlx = { version = "0.7", features = ["runtime-tokio-native-tls", "postgres", "uuid", "chrono"] }
tokio = { version = "1.38", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
